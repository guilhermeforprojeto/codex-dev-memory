name: Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest==9.2.0
      - name: Provision public local model assets
        shell: pwsh
        run: python scripts/cdm.py --project . init --download-models
      - name: Native memory, compression, safety and installer tests
        shell: pwsh
        run: python -m pytest tests -q
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object FullName -NotMatch '\.codex-dev-memory' | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            $failures += $errors
          }
          if ($failures.Count) { $failures | Format-List; exit 1 }
      - name: PowerShell update dispatch regression
        shell: pwsh
        run: ./tests/dispatch.ps1
